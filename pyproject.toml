[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-metropolis-mcmc"
version = "1.0.0"
description = "Educational Metropolis-Hastings and Adaptive Metropolis samplers with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Bahareh Keshavarz"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
notebook = ["matplotlib>=3.8", "pandas>=2.0", "scipy>=1.11", "jupyter>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Bahareh527/adaptive-metropolis-mcmc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
